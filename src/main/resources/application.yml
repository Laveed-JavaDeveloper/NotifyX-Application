spring:
  application:
    name: notifyx

  datasource:
    url: jdbc:h2:mem:notifyx_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss

  # Disable Kafka autoconfigure (not used in standalone mode)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

server:
  port: 8080

# Async thread pool for notification processing
notifyx:
  async:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 500
  rate-limit:
    requests-per-minute: 5
  delivery:
    success-rate: 80  # percentage
    simulate-delay-ms: 800  # simulate network latency
